<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        input { padding: 10px; width: 300px; margin: 5px 0; }
        button { padding: 12px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h2>Cadastro de Alunos</h2>
    <form action="/salvar" method="POST">
        <label>Nome:</label><br>
        <input type="text" name="nome" placeholder="Digite seu nome" required>
        <br><br>
        <label>Cidade:</label><br>
        <input type="text" name="cidade" placeholder="Digite sua cidade">
        <br><br>
        <button type="submit">Cadastrar no Banco</button>
    </form>
</body>
</html>
